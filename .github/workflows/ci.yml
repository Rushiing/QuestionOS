name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0.2/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: v0.2/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  java-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: qos_auth_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qos_auth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QOS_AUTH_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/qos_auth_test
      QOS_AUTH_TEST_DB_USER: postgres
    defaults:
      run:
        working-directory: java-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -DskipTests compile
      - run: mvn test

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0.2/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v0.2/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run typecheck
      - run: npm run build

  core-smoke:
    runs-on: ubuntu-latest
    needs: [java-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: v0.2/frontend/package-lock.json
      - run: npm ci
        working-directory: v0.2/frontend
      - run: npm run build
        working-directory: v0.2/frontend
      - run: bash scripts/ci-core-smoke.sh
